server:
  port: 8080

hoffmanai:
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}
  chat-daily-limit: ${CHAT_DAILY_LIMIT:30}
  chat-weekly-limit: ${CHAT_WEEKLY_LIMIT:100}

openrouter:
  api-key: ${OPENROUTER_API_KEY:}
  url: ${OPENROUTER_URL:https://openrouter.ai/api/v1/chat/completions}
  model: ${OPENROUTER_MODEL:xiaomi/mimo-v2.6-flash}
  max-input-tokens: ${OPENROUTER_MAX_INPUT_TOKENS:20000}
  max-output-tokens: ${OPENROUTER_MAX_OUTPUT_TOKENS:20000}
