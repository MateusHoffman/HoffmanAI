app = "hoffmanai"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[env]
  API_UPSTREAM = "hoffmanai-api.internal:8080"

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "5s"
    method = "GET"
    path = "/"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
